<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AWS VPN Client</title>
</head>
<!--
    A stand-in for the success page served by AWS VPN Client 6.x. Only the
    structure the extension keys on is reproduced here: a header with the
    branding, and a card holding a checkmark, an <h1> title and a <p> subtitle.
    The real page styles these and localises all three strings.
-->
<body>
<div class="header">
    <div class="brand"><span class="aws">AWS</span> VPN Client</div>
</div>
<div class="card">
    <div class="checkmark"></div>
    <h1>Authentication successful</h1>
    <p>You can close this window.</p>
</div>
</body>
</html>
